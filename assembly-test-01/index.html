<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NIRARA — Assembly Test 01</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="scene" aria-label="NIRARA assembly test 01 made from real public-domain and CC0 image fragments">
    <div class="base-materials" aria-hidden="true">
      <img class="base concrete" src="https://cdn.polyhaven.com/asset_img/primary/cracked_concrete.png?height=760&quality=95&v=bd50940c" alt="" />
      <img class="base cloth" src="https://upload.wikimedia.org/wikipedia/commons/1/13/ClothPack02.jpg" alt="" />
      <img class="base ruin" src="https://dl.polyhaven.org/file/ph-assets/HDRIs/extra/Backplates/roofless_ruins/jpg_pretty/IMG_0468.jpg" alt="" />
      <img class="base gravel" src="https://upload.wikimedia.org/wikipedia/commons/c/c6/Gray_Gravel_Rock_Texture_by_Photos_Public_Domain.jpg" alt="" />
    </div>

    <section class="dark-field" aria-hidden="true">
      <div class="mass mass-a"><img src="https://dl.polyhaven.org/file/ph-assets/HDRIs/extra/Backplates/roofless_ruins/jpg_pretty/IMG_0468.jpg" alt="" /></div>
      <div class="mass mass-b"><img src="https://upload.wikimedia.org/wikipedia/commons/d/df/Cracked_color_surface.jpg" alt="" /></div>
      <div class="mass mass-c"><img src="https://cdn.polyhaven.com/asset_img/primary/cracked_concrete.png?height=760&quality=95&v=bd50940c" alt="" /></div>
      <div class="mass mass-d"><img src="https://upload.wikimedia.org/wikipedia/commons/1/13/ClothPack02.jpg" alt="" /></div>
    </section>

    <section class="witness-field" aria-hidden="true">
      <div class="witness w1"><img src="https://upload.wikimedia.org/wikipedia/commons/1/17/China_doll_heads%2C_1750-1870_-_Fairbanks_Museum_and_Planetarium_-_DSC04299.JPG" alt="" /></div>
      <div class="witness w2"><img src="https://upload.wikimedia.org/wikipedia/commons/1/17/China_doll_heads%2C_1750-1870_-_Fairbanks_Museum_and_Planetarium_-_DSC04299.JPG" alt="" /></div>
      <div class="witness w3"><img src="https://upload.wikimedia.org/wikipedia/commons/1/17/China_doll_heads%2C_1750-1870_-_Fairbanks_Museum_and_Planetarium_-_DSC04299.JPG" alt="" /></div>
      <div class="witness w4"><img src="https://upload.wikimedia.org/wikipedia/commons/1/17/China_doll_heads%2C_1750-1870_-_Fairbanks_Museum_and_Planetarium_-_DSC04299.JPG" alt="" /></div>
      <div class="witness w5"><img src="https://upload.wikimedia.org/wikipedia/commons/1/17/China_doll_heads%2C_1750-1870_-_Fairbanks_Museum_and_Planetarium_-_DSC04299.JPG" alt="" /></div>
    </section>

    <section class="centre" aria-hidden="true">
      <img class="centre-frag cf1" src="https://upload.wikimedia.org/wikipedia/commons/1/13/ClothPack02.jpg" alt="" />
      <img class="centre-frag cf2" src="https://cdn.polyhaven.com/asset_img/primary/cracked_concrete.png?height=760&quality=95&v=bd50940c" alt="" />
      <img class="centre-frag cf3" src="https://upload.wikimedia.org/wikipedia/commons/c/c6/Gray_Gravel_Rock_Texture_by_Photos_Public_Domain.jpg" alt="" />
      <img class="centre-frag cf4" src="https://upload.wikimedia.org/wikipedia/commons/6/6e/Cloth_texture.jpg" alt="" />\n      <div class="centre-frag cf5"><img src="https://upload.wikimedia.org/wikipedia/commons/1/17/China_doll_heads%2C_1750-1870_-_Fairbanks_Museum_and_Planetarium_-_DSC04299.JPG" alt="" /></div>
      <span class="centre-shadow"></span>
    </section>

    <section class="cry-zone" aria-hidden="true">
      <div class="cry"><img src="https://collectionapi.metmuseum.org/api/collection/v1/iiif/207763/420149/main-image" alt="" /></div>
      <img class="cry-stain" src="https://upload.wikimedia.org/wikipedia/commons/e/e4/View_of_handyman_drip_art_wall_painting_closeup_on_section.JPG" alt="" />
    </section>

    <section class="colour-contamination" aria-hidden="true">
      <img class="paint p1" src="https://upload.wikimedia.org/wikipedia/commons/e/e4/View_of_handyman_drip_art_wall_painting_closeup_on_section.JPG" alt="" />
      <img class="paint p2" src="https://upload.wikimedia.org/wikipedia/commons/d/df/Cracked_color_surface.jpg" alt="" />
    </section>

    <div class="veil" aria-hidden="true"></div>
  </main>
</body>
</html>
