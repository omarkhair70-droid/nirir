<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NIRARA — Visual Slice 01</title>
  <meta name="theme-color" content="#050505" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="scene" aria-label="NIRARA visual slice 01">
    <div class="grain" aria-hidden="true"></div>
    <div class="falloff" aria-hidden="true"></div>

    <section class="witnesses" aria-hidden="true">
      <div class="block block-a"><div class="being b1" data-track=".35"><div class="body"></div><div class="head"><div class="eyes"><i></i><i></i></div></div></div></div>
      <div class="block block-b"><div class="being b2" data-track=".55"><div class="body"></div><div class="head"><div class="eyes"><i></i><i></i></div></div></div></div>
      <div class="block block-c"><div class="being b3" data-track=".22"><div class="body"></div><div class="head"><div class="eyes"><i></i><i></i></div></div></div></div>
      <div class="block block-d"><div class="being b4" data-track=".7"><div class="body"></div><div class="head"><div class="eyes"><i></i><i></i></div></div></div></div>
      <div class="block block-e"><div class="being b5" data-track=".48"><div class="body"></div><div class="head"><div class="eyes"><i></i><i></i></div></div></div></div>
      <div class="block block-f"><div class="being b6" data-track=".3"><div class="body"></div><div class="head"><div class="eyes"><i></i><i></i></div></div></div></div>
    </section>

    <section class="unknown" aria-hidden="true">
      <span class="unknown-layer layer-a"></span>
      <span class="unknown-layer layer-b"></span>
      <span class="unknown-layer layer-c"></span>
      <span class="unknown-cut"></span>
    </section>

    <section class="cry-zone" aria-label="A small isolated figure cries unheard">
      <div class="cry-ripple r1"></div>
      <div class="cry-ripple r2"></div>
      <div class="cry-ripple r3"></div>
      <div class="crying-being">
        <div class="cry-body"></div>
        <div class="cry-head">
          <span class="cry-eye left"></span>
          <span class="cry-eye right"></span>
          <span class="cry-mouth"></span>
        </div>
      </div>
    </section>

    <p class="mark">NIRARA / VISUAL SLICE 01</p>
  </main>
  <script src="./script.js"></script>
</body>
</html>
