name: NIRARA Assembly Test 01 Render

on:
  push:
    branches:
      - visual/assembly-test-01-real-fragments-20260924
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Serve
        run: |
          cd assembly-test-01
          python3 -m http.server 4173 >/tmp/nirara-assembly.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:4173/ >/dev/null

      - name: Capture desktop
        run: |
          "${{ steps.chrome.outputs.chrome-path }}" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=1440,1000 \
            --virtual-time-budget=10000 \
            --run-all-compositor-stages-before-draw \
            --screenshot=nirara-assembly-test-01-desktop.png \
            http://127.0.0.1:4173/

      - name: Capture mobile
        run: |
          "${{ steps.chrome.outputs.chrome-path }}" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=390,844 \
            --virtual-time-budget=10000 \
            --run-all-compositor-stages-before-draw \
            --screenshot=nirara-assembly-test-01-mobile.png \
            http://127.0.0.1:4173/

      - uses: actions/upload-artifact@v4
        with:
          name: nirara-assembly-test-01
          path: |
            nirara-assembly-test-01-desktop.png
            nirara-assembly-test-01-mobile.png
          if-no-files-found: error
